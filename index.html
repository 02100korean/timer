<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 타이머 및 시계</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Noto Sans KR 폰트 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.3);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-screen w-screen overflow-hidden flex flex-col select-none transition-colors duration-300">

    <div id="app-container" class="flex-1 flex flex-col h-full w-full p-3 md:p-6 gap-3 overflow-hidden">
        
        <!-- 상단 헤더: 시계 제목 (글박스) 및 설정 사이드바 열기 아이콘 -->
        <header id="main-header" class="w-full flex items-center justify-between shrink-0 px-2">
            <div id="title-wrapper" class="flex-1 flex justify-center">
                <input type="text" id="sidebar-title-input" value="시험 시간표" oninput="updateMainTitle(this.value)" class="bg-transparent hover:bg-slate-200/50 dark:hover:bg-slate-900/50 focus:bg-white dark:focus:bg-slate-900 text-slate-900 dark:text-white font-bold text-xl md:text-2xl px-3 py-1.5 rounded-xl border border-transparent focus:border-blue-500 dark:focus:border-blue-500 focus:outline-none transition text-center max-w-md shadow-none" style="text-align: center;">
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleSidebar()" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-blue-500/60 dark:border-blue-500/60 transition shadow-sm" title="설정">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </header>

        <!-- 중앙 콘텐츠 영역 (메모장 위치 모드에 따라 flex-col 또는 flex-row 동적 변경) -->
        <div id="content-layout-wrapper" class="flex-1 flex flex-col gap-3 overflow-hidden">
            
            <!-- 시계/타이머 메인 패널 -->
            <div id="main-display-panel" class="flex-1 flex flex-col items-center justify-center p-4 bg-white dark:bg-slate-900 border border-blue-500/60 dark:border-blue-500/60 rounded-3xl shadow-lg relative overflow-hidden" style="flex: 1;">
                
                <!-- 1. 현재 시각 뷰 -->
                <div id="view-clock-container" class="w-full flex flex-col items-center justify-center hidden">
                    <div id="clock-date" class="text-slate-500 dark:text-slate-400 font-semibold text-lg md:text-2xl mb-2 tracking-wide">2026년 10월 16일 금요일</div>
                    <div class="flex items-baseline justify-center gap-2 md:gap-3">
                        <div id="clock-ampm" class="text-blue-600 dark:text-blue-400 font-extrabold text-2xl md:text-4xl tracking-widest uppercase">오전</div>
                        <div id="clock-time" class="font-black tracking-wider text-slate-900 dark:text-white" style="font-size: 8rem; line-height: 1;">08:12</div>
                    </div>
                </div>

                <!-- 2. 단일 타이머 뷰 -->
                <div id="view-timer-container" class="w-full flex flex-col items-center justify-center">
                    <div id="timer-inner-layout" class="flex flex-row items-center justify-center gap-6">
                        <div id="timer-display" contenteditable="true" onblur="syncEditableTimer(this.innerText)" class="font-black tracking-wider text-slate-900 dark:text-white py-2 text-center outline-none border-b-2 border-dashed border-transparent hover:border-blue-400 transition" style="font-size: 8rem; line-height: 1;" title="클릭하여 직접 시간을 입력할 수 있습니다">10:00</div>

                        <div id="timer-controls-wrapper" class="flex flex-col items-center justify-center gap-2.5">
                            <button id="btn-timer-toggle" onclick="toggleTimer()" class="w-28 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center">시작</button>
                            <button onclick="resetTimer()" class="w-28 py-3 bg-white hover:bg-slate-50 dark:bg-slate-900 dark:hover:bg-slate-800 text-blue-600 dark:text-blue-400 font-semibold rounded-2xl border border-blue-600 dark:border-blue-500 shadow transition transform active:scale-95 text-base text-center">초기화</button>
                        </div>
                    </div>
                </div>

                <!-- 3. 연속 타이머 뷰 -->
                <div id="view-seq-timer-container" class="w-full flex flex-col items-center justify-center hidden">
                    <!-- 현재 진행 중인 연속 타이머 정보 배지 -->
                    <div class="mb-3 px-4 py-1.5 bg-blue-50 dark:bg-blue-950/50 border border-blue-500/40 rounded-full flex items-center gap-2">
                        <span id="seq-step-badge" class="text-xs font-bold text-blue-600 dark:text-blue-400">타이머 1 / 3</span>
                        <span class="text-xs text-slate-400">|</span>
                        <span id="seq-mode-badge" class="text-xs font-semibold text-slate-600 dark:text-slate-300">자동 진행</span>
                    </div>

                    <div id="seq-timer-inner-layout" class="flex flex-row items-center justify-center gap-6">
                        <div id="seq-timer-display" class="font-black tracking-wider text-slate-900 dark:text-white py-2 text-center" style="font-size: 8rem; line-height: 1;">00:00</div>

                        <div id="seq-timer-controls-wrapper" class="flex flex-col items-center justify-center gap-2.5">
                            <button id="btn-seq-toggle" onclick="toggleSeqTimer()" class="w-28 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center">시작</button>
                            <button onclick="resetSeqTimer()" class="w-28 py-3 bg-white hover:bg-slate-50 dark:bg-slate-900 dark:hover:bg-slate-800 text-blue-600 dark:text-blue-400 font-semibold rounded-2xl border border-blue-600 dark:border-blue-500 shadow transition transform active:scale-95 text-base text-center">초기화</button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 메모장 박스 -->
            <div id="memo-container" class="bg-white dark:bg-slate-900 border border-blue-500/60 dark:border-blue-500/60 rounded-3xl p-4 shadow-lg flex flex-col shrink-0 transition-all" style="height: 40vh; width: 100%;">
                <div id="memo-editor" contenteditable="true" class="flex-1 w-full bg-slate-50 dark:bg-slate-950/40 border border-blue-400/40 dark:border-blue-500/40 rounded-2xl p-4 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500 overflow-y-auto shadow-inner transition-all" style="font-size: 26pt; line-height: 1.4;" placeholder="주의사항이나 안내 문구를 입력하세요.">시험 중 전자기기 소지 금지</div>
            </div>

        </div>

    </div>

    <!-- 설정 사이드바 -->
    <aside id="settings-sidebar" class="fixed top-0 right-0 h-full w-80 md:w-96 bg-white dark:bg-slate-900 border-l border-blue-500/60 dark:border-blue-500/60 p-5 flex flex-col gap-5 shadow-2xl overflow-y-auto z-50 transition-transform duration-300 transform translate-x-full">
        
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
            <h2 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                <span>⚙️</span> 제어판 및 설정
            </h2>
            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:scale-105 transition text-slate-800 dark:text-slate-200 shadow-sm" title="테마 전환">
                    <svg id="theme-icon-dark" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="theme-icon-light" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                <button onclick="toggleSidebar()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 transition text-slate-700 dark:text-slate-300">
                    ✕
                </button>
            </div>
        </div>

        <!-- 1. 화면 모드 선택 -->
        <div class="space-y-2">
            <label class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">화면 모드 선택</label>
            <div class="grid grid-cols-3 gap-1.5 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-xl border border-blue-400/40 dark:border-blue-500/40">
                <button id="btn-view-clock" onclick="switchView('clock')" class="py-2 rounded-lg font-bold text-xs transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">현재 시각</button>
                <button id="btn-view-timer" onclick="switchView('timer')" class="py-2 rounded-lg font-bold text-xs transition bg-blue-600 text-white shadow">타이머</button>
                <button id="btn-view-seq" onclick="switchView('seq')" class="py-2 rounded-lg font-bold text-xs transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">연속 타이머</button>
            </div>
        </div>

        <!-- 2. 시계 제목 설정 -->
        <div class="space-y-3 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-blue-400/40 dark:border-blue-500/40">
            <label class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">시계 제목 설정</label>
            
            <div class="space-y-1.5">
                <span class="text-xs text-slate-600 dark:text-slate-400">정렬</span>
                <div class="grid grid-cols-3 gap-1.5 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-blue-400/40 dark:border-blue-500/40">
                    <button onclick="setTitleAlign('left')" id="btn-align-left" class="py-1 rounded-lg font-bold text-xs text-slate-600 dark:text-slate-400 transition">왼쪽</button>
                    <button onclick="setTitleAlign('center')" id="btn-align-center" class="py-1 rounded-lg font-bold text-xs bg-blue-600 text-white shadow transition">중앙</button>
                    <button onclick="setTitleAlign('right')" id="btn-align-right" class="py-1 rounded-lg font-bold text-xs text-slate-600 dark:text-slate-400 transition">오른쪽</button>
                </div>
            </div>

            <div class="space-y-1 pt-1">
                <div class="flex justify-between text-xs text-slate-600 dark:text-slate-400">
                    <span>글자 크기</span>
                    <span id="title-fontsize-label">1.5rem</span>
                </div>
                <input type="range" id="title-fontsize-range" min="1" max="3" step="0.1" value="1.5" oninput="changeTitleFontSize(this.value)" class="w-full accent-blue-600 cursor-pointer">
            </div>

            <div class="space-y-1.5 pt-1">
                <span class="text-xs text-slate-600 dark:text-slate-400">글자 색상</span>
                <div class="flex items-center gap-2">
                    <button onclick="setTitleColor('#ffffff')" class="w-5 h-5 rounded-full bg-white hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="하얀색"></button>
                    <button onclick="setTitleColor('#1e293b')" class="w-5 h-5 rounded-full bg-slate-800 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="네이비/진한색"></button>
                    <button onclick="setTitleColor('#ef4444')" class="w-5 h-5 rounded-full bg-red-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="빨간색"></button>
                    <button onclick="setTitleColor('#3b82f6')" class="w-5 h-5 rounded-full bg-blue-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="파란색"></button>
                    <button onclick="setTitleColor('#10b981')" class="w-5 h-5 rounded-full bg-emerald-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="초록색"></button>
                    <button onclick="setTitleColor('#eab308')" class="w-5 h-5 rounded-full bg-yellow-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="노란색"></button>
                    <button onclick="setTitleColor('#a855f7')" class="w-5 h-5 rounded-full bg-purple-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="보라색"></button>
                </div>
            </div>
        </div>

        <!-- 3. 메모장 레이아웃 및 크기 설정 -->
        <div class="space-y-3 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-blue-400/40 dark:border-blue-500/40">
            <div class="flex items-center justify-between">
                <label class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">메모장 표시 여부</label>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="memo-show-toggle" checked onchange="toggleMemoVisibility(this.checked)" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <div id="memo-settings-subgroup" class="space-y-3 pt-2 border-t border-slate-200 dark:border-slate-700">
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-layout-bottom" onclick="setLayoutMode('bottom')" class="py-2 rounded-lg font-bold text-xs transition bg-blue-600 text-white shadow">하단 배치</button>
                    <button id="btn-layout-right" onclick="setLayoutMode('right')" class="py-2 rounded-lg font-bold text-xs transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">우측 배치</button>
                </div>
                
                <div class="space-y-1 pt-1">
                    <div class="flex justify-between text-xs text-slate-600 dark:text-slate-400">
                        <span id="memo-size-title">메모장 높이 비율</span>
                        <span id="memo-size-label">40%</span>
                    </div>
                    <input type="range" id="memo-size-range" min="15" max="80" value="40" oninput="changeMemoSize(this.value)" class="w-full accent-blue-600 cursor-pointer">
                </div>
            </div>
        </div>

        <!-- 현재 시각 상세 설정 (시계 모드일 때만 표시) -->
        <div id="settings-clock-group" class="space-y-3 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-blue-400/40 dark:border-blue-500/40 hidden">
            <label class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">시계 표시 설정</label>
            
            <div class="space-y-1.5">
                <span class="text-xs text-slate-600 dark:text-slate-400">시간 형식</span>
                <div class="grid grid-cols-2 gap-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-blue-400/40 dark:border-blue-500/40">
                    <label class="flex items-center justify-center gap-1.5 py-1.5 rounded-lg font-bold text-xs cursor-pointer text-slate-700 dark:text-slate-300">
                        <input type="radio" name="clock-type" value="12" checked onchange="updateClockSettings()"> 12시간제
                    </label>
                    <label class="flex items-center justify-center gap-1.5 py-1.5 rounded-lg font-bold text-xs cursor-pointer text-slate-700 dark:text-slate-300">
                        <input type="radio" name="clock-type" value="24" onchange="updateClockSettings()"> 24시간제
                    </label>
                </div>
            </div>

            <div class="flex items-center justify-between pt-1">
                <span class="text-xs text-slate-600 dark:text-slate-400">초 단위 표시</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="clock-show-seconds" checked onchange="updateClockSettings()" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <div class="flex items-center justify-between pt-1">
                <span class="text-xs text-slate-600 dark:text-slate-400">날짜 및 요일 표시</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="clock-show-date" checked onchange="updateClockSettings()" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>
        </div>

        <!-- 단일 타이머 상세 설정 (타이머 모드일 때만 표시) -->
        <div id="settings-timer-group" class="space-y-3 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-blue-400/40 dark:border-blue-500/40">
            <label class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">타이머 빠른 설정</label>
            <div class="grid grid-cols-3 gap-1.5">
                <button onclick="setTimerMinutes(3)" class="py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition font-bold">3분</button>
                <button onclick="setTimerMinutes(5)" class="py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition font-bold">5분</button>
                <button onclick="setTimerMinutes(10)" class="py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition font-bold">10분</button>
                <button onclick="setTimerMinutes(20)" class="py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition font-bold">20분</button>
                <button onclick="setTimerMinutes(30)" class="py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition font-bold">30분</button>
                <button onclick="setTimerMinutes(40)" class="py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition font-bold">40분</button>
                <button onclick="setTimerMinutes(50)" class="py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition font-bold">50분</button>
                <button onclick="setTimerMinutes(60)" class="py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition font-bold">60분</button>
                <button onclick="setTimerMinutes(70)" class="py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs rounded-xl border border-slate-300 dark:border-slate-700 transition font-bold">70분</button>
            </div>
        </div>

        <!-- 연속 타이머 상세 설정 -->
        <div id="settings-seq-group" class="space-y-3 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-blue-400/40 dark:border-blue-500/40 hidden">
            <label class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">연속 타이머 설정</label>
            
            <div class="space-y-1.5">
                <span class="text-xs text-slate-600 dark:text-slate-400">시간 목록 (콤마/띄어쓰기, 예: 3:02, 5, 10)</span>
                <input type="text" id="seq-times-input" value="3, 5, 10, 30, 5, 10" onchange="updateSeqConfig()" class="w-full bg-white dark:bg-slate-800 text-xs text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-blue-500 font-bold" placeholder="예: 3:02, 5, 10">
            </div>

            <div class="space-y-1.5 pt-1">
                <span class="text-xs text-slate-600 dark:text-slate-400">진행 방식</span>
                <div class="grid grid-cols-2 gap-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-blue-400/40 dark:border-blue-500/40">
                    <button id="btn-seq-auto" onclick="setSeqMode('auto')" class="py-1.5 rounded-lg font-bold text-xs bg-blue-600 text-white shadow transition">자동 넘어감</button>
                    <button id="btn-seq-manual" onclick="setSeqMode('manual')" class="py-1.5 rounded-lg font-bold text-xs text-slate-600 dark:text-slate-400 transition">수동 대기</button>
                </div>
            </div>
        </div>

        <!-- 폰트 크기 및 색상 설정 -->
        <div class="space-y-3 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-blue-400/40 dark:border-blue-500/40">
            <label class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">글자 크기 설정</label>
            
            <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-600 dark:text-slate-400">
                    <span>시계/타이머 숫자 크기 (최대 22rem)</span>
                    <span id="num-fontsize-label">8rem</span>
                </div>
                <input type="range" id="num-fontsize-range" min="4" max="22" step="0.5" value="8" oninput="changeNumberFontSize(this.value)" class="w-full accent-blue-600 cursor-pointer">
            </div>

            <div class="space-y-1 pt-2 border-t border-slate-200 dark:border-slate-700">
                <div class="flex justify-between text-xs text-slate-600 dark:text-slate-400">
                    <span>메모장 글자 크기</span>
                    <span id="memo-fontsize-label">26pt</span>
                </div>
                <input type="range" id="memo-fontsize-range" min="18" max="48" value="26" oninput="changeMemoFontSize(this.value)" class="w-full accent-blue-600 cursor-pointer">
            </div>

            <div class="space-y-1.5 pt-1">
                <span class="text-xs text-slate-600 dark:text-slate-400">메모장 글자 색상 변경 (드래그 선택 후 적용)</span>
                <div class="flex items-center gap-2">
                    <button onclick="setForeColor('#ffffff')" class="w-6 h-6 rounded-full bg-white hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="하얀색"></button>
                    <button onclick="setForeColor('#1e293b')" class="w-6 h-6 rounded-full bg-slate-800 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="네이비/진한색"></button>
                    <button onclick="setForeColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="빨간색"></button>
                    <button onclick="setForeColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="파란색"></button>
                    <button onclick="setForeColor('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="초록색"></button>
                    <button onclick="setForeColor('#eab308')" class="w-6 h-6 rounded-full bg-yellow-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="노란색"></button>
                    <button onclick="setForeColor('#a855f7')" class="w-6 h-6 rounded-full bg-purple-500 hover:scale-110 transition border border-slate-300 dark:border-slate-700 shadow-sm" title="보라색"></button>
                </div>
            </div>
        </div>

        <!-- 오디오 알람 설정 -->
        <div class="space-y-3 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-blue-400/40 dark:border-blue-500/40">
            <div class="flex items-center justify-between">
                <label class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">오디오 알람</label>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="alarm-enabled" checked class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <div class="space-y-1.5 pt-1">
                <span class="text-xs text-slate-600 dark:text-slate-400">알람 사운드 선택</span>
                <select id="alarm-sound-select" class="w-full bg-white dark:bg-slate-800 text-xs text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-blue-500 font-bold">
                    <option value="beep2">비퍼음 2</option>
                    <option value="chime">딩동댕</option>
                    <option value="beep">비퍼음</option>
                    <option value="bell">잔잔한 음악 (오르골)</option>
                </select>
            </div>
        </div>

    </aside>

    <script>
        let currentLayoutMode = 'bottom'; // 'bottom' 또는 'right'
        let isMemoVisible = true;

        // 메모장 표시 여부 토글
        function toggleMemoVisibility(show) {
            isMemoVisible = show;
            const memoContainer = document.getElementById('memo-container');
            const subgroup = document.getElementById('memo-settings-subgroup');
            if (show) {
                memoContainer.classList.remove('hidden');
                subgroup.classList.remove('opacity-50', 'pointer-events-none');
                setLayoutMode(currentLayoutMode);
            } else {
                memoContainer.classList.add('hidden');
                subgroup.classList.add('opacity-50', 'pointer-events-none');
                // 메모장이 숨겨지면 메인 패널이 전체 화면을 차지하도록 복구
                const wrapper = document.getElementById('content-layout-wrapper');
                wrapper.className = "flex-1 flex flex-col gap-3 overflow-hidden";
                const timerInnerLayout = document.getElementById('timer-inner-layout');
                const seqInnerLayout = document.getElementById('seq-timer-inner-layout');
                timerInnerLayout.className = "flex flex-row items-center justify-center gap-6";
                seqInnerLayout.className = "flex flex-row items-center justify-center gap-6";
            }
        }

        // 사이드바 열기/닫기 토글
        function toggleSidebar() {
            const sidebar = document.getElementById('settings-sidebar');
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
            } else {
                sidebar.classList.add('translate-x-full');
            }
        }

        // 라이트/다크 테마 전환
        function toggleTheme() {
            const htmlEl = document.documentElement;
            const memoEditor = document.getElementById('memo-editor');
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                if (memoEditor.style.color === '' || memoEditor.style.color === 'rgb(255, 255, 255)') {
                    memoEditor.style.color = '#1e293b';
                }
            } else {
                htmlEl.classList.add('dark');
                if (memoEditor.style.color === '' || memoEditor.style.color === 'rgb(30, 41, 59)') {
                    memoEditor.style.color = '#ffffff';
                }
            }
        }

        // 레이아웃 모드 설정 (하단 vs 우측)
        function setLayoutMode(mode) {
            if (!isMemoVisible) return;
            currentLayoutMode = mode;
            const wrapper = document.getElementById('content-layout-wrapper');
            const memoContainer = document.getElementById('memo-container');
            const timerInnerLayout = document.getElementById('timer-inner-layout');
            const seqInnerLayout = document.getElementById('seq-timer-inner-layout');
            const btnBottom = document.getElementById('btn-layout-bottom');
            const btnRight = document.getElementById('btn-layout-right');
            const memoSizeRange = document.getElementById('memo-size-range');
            const memoSizeTitle = document.getElementById('memo-size-title');
            const memoSizeLabel = document.getElementById('memo-size-label');

            if (mode === 'bottom') {
                wrapper.className = "flex-1 flex flex-col gap-3 overflow-hidden";
                memoContainer.style.height = "40vh";
                memoContainer.style.width = "100%";
                timerInnerLayout.className = "flex flex-row items-center justify-center gap-6";
                seqInnerLayout.className = "flex flex-row items-center justify-center gap-6";
                btnBottom.className = "py-2 rounded-lg font-bold text-xs transition bg-blue-600 text-white shadow";
                btnRight.className = "py-2 rounded-lg font-bold text-xs transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";
                memoSizeRange.value = 40;
                memoSizeTitle.innerText = "메모장 높이 비율";
                memoSizeLabel.innerText = "40%";
            } else {
                wrapper.className = "flex-1 flex flex-row gap-3 overflow-hidden";
                memoContainer.style.height = "100%";
                memoContainer.style.width = "35%";
                timerInnerLayout.className = "flex flex-col items-center justify-center gap-4";
                seqInnerLayout.className = "flex flex-col items-center justify-center gap-4";
                btnRight.className = "py-2 rounded-lg font-bold text-xs transition bg-blue-600 text-white shadow";
                btnBottom.className = "py-2 rounded-lg font-bold text-xs transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";
                memoSizeRange.value = 35;
                memoSizeTitle.innerText = "메모장 너비 비율";
                memoSizeLabel.innerText = "35%";
            }
        }

        // 메모장 크기 슬라이더 조절
        function changeMemoSize(val) {
            const memoContainer = document.getElementById('memo-container');
            const memoSizeLabel = document.getElementById('memo-size-label');
            memoSizeLabel.innerText = val + '%';

            if (currentLayoutMode === 'bottom') {
                memoContainer.style.height = val + '%';
            } else {
                memoContainer.style.width = val + '%';
            }
        }

        function updateMainTitle(val) {}

        // 시계 제목 정렬 (디폴트 중앙)
        function setTitleAlign(align) {
            const titleInput = document.getElementById('sidebar-title-input');
            const wrapper = document.getElementById('title-wrapper');
            const btnLeft = document.getElementById('btn-align-left');
            const btnCenter = document.getElementById('btn-align-center');
            const btnRight = document.getElementById('btn-align-right');

            btnLeft.className = "py-1 rounded-lg font-bold text-xs text-slate-600 dark:text-slate-400 transition";
            btnCenter.className = "py-1 rounded-lg font-bold text-xs text-slate-600 dark:text-slate-400 transition";
            btnRight.className = "py-1 rounded-lg font-bold text-xs text-slate-600 dark:text-slate-400 transition";

            if (align === 'left') {
                wrapper.className = "flex-1 flex justify-start";
                titleInput.style.textAlign = "left";
                btnLeft.className = "py-1 rounded-lg font-bold text-xs bg-blue-600 text-white shadow transition";
            } else if (align === 'center') {
                wrapper.className = "flex-1 flex justify-center";
                titleInput.style.textAlign = "center";
                btnCenter.className = "py-1 rounded-lg font-bold text-xs bg-blue-600 text-white shadow transition";
            } else {
                wrapper.className = "flex-1 flex justify-end";
                titleInput.style.textAlign = "right";
                btnRight.className = "py-1 rounded-lg font-bold text-xs bg-blue-600 text-white shadow transition";
            }
        }

        // 시계 제목 글자 크기 조절
        function changeTitleFontSize(sizeVal) {
            const sizeStr = sizeVal + 'rem';
            const titleInput = document.getElementById('sidebar-title-input');
            titleInput.style.fontSize = sizeStr;
            document.getElementById('title-fontsize-label').innerText = sizeVal + 'rem';
        }

        // 시계 제목 글자 색상 조절
        function setTitleColor(color) {
            const titleInput = document.getElementById('sidebar-title-input');
            titleInput.style.color = color;
        }

        // 화면 전환 (현재 시각 / 타이머 / 연속 타이머)
        function switchView(view) {
            const clockContainer = document.getElementById('view-clock-container');
            const timerContainer = document.getElementById('view-timer-container');
            const seqContainer = document.getElementById('view-seq-timer-container');
            const settingsClockGroup = document.getElementById('settings-clock-group');
            const settingsTimerGroup = document.getElementById('settings-timer-group');
            const settingsSeqGroup = document.getElementById('settings-seq-group');
            const btnClock = document.getElementById('btn-view-clock');
            const btnTimer = document.getElementById('btn-view-timer');
            const btnSeq = document.getElementById('btn-view-seq');

            // 초기화
            clockContainer.classList.add('hidden');
            timerContainer.classList.add('hidden');
            seqContainer.classList.add('hidden');
            settingsClockGroup.classList.add('hidden');
            settingsTimerGroup.classList.add('hidden');
            settingsSeqGroup.classList.add('hidden');
            btnClock.className = "py-2 rounded-lg font-bold text-xs transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";
            btnTimer.className = "py-2 rounded-lg font-bold text-xs transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";
            btnSeq.className = "py-2 rounded-lg font-bold text-xs transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";

            if (view === 'clock') {
                clockContainer.classList.remove('hidden');
                settingsClockGroup.classList.remove('hidden');
                btnClock.className = "py-2 rounded-lg font-bold text-xs transition bg-blue-600 text-white shadow";
            } else if (view === 'timer') {
                timerContainer.classList.remove('hidden');
                settingsTimerGroup.classList.remove('hidden');
                btnTimer.className = "py-2 rounded-lg font-bold text-xs transition bg-blue-600 text-white shadow";
            } else {
                seqContainer.classList.remove('hidden');
                settingsSeqGroup.classList.remove('hidden');
                btnSeq.className = "py-2 rounded-lg font-bold text-xs transition bg-blue-600 text-white shadow";
                initSeqTimer();
            }
        }

        function updateClockSettings() {
            updateClock();
        }

        // 실시간 시계 로직 (안전한 요소 확인 추가)
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dayName = days[now.getDay()];

            const showDateCheckbox = document.getElementById('clock-show-date');
            const showDate = showDateCheckbox ? showDateCheckbox.checked : true;
            const dateEl = document.getElementById('clock-date');
            if (dateEl) {
                if (showDate) {
                    dateEl.innerText = `${year}년 ${month}월 ${date}일 ${dayName}요일`;
                    dateEl.classList.remove('hidden');
                } else {
                    dateEl.classList.add('hidden');
                }
            }

            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            let clockTypeVal = '12';
            const typeRadios = document.getElementsByName('clock-type');
            for (const r of typeRadios) {
                if (r.checked) {
                    clockTypeVal = r.value;
                    break;
                }
            }

            const showSecCheckbox = document.getElementById('clock-show-seconds');
            const showSec = showSecCheckbox ? showSecCheckbox.checked : true;
            const ampmEl = document.getElementById('clock-ampm');

            let timeStr = '';
            if (clockTypeVal === '12') {
                const ampm = hours >= 12 ? '오후' : '오전';
                if (ampmEl) {
                    ampmEl.innerText = ampm;
                    ampmEl.classList.remove('hidden');
                }

                hours = hours % 12;
                hours = hours ? hours : 12;

                const hStr = String(hours).padStart(2, '0');
                const mStr = String(minutes).padStart(2, '0');
                const sStr = String(seconds).padStart(2, '0');

                timeStr = showSec ? `${hStr}:${mStr}:${sStr}` : `${hStr}:${mStr}`;
            } else {
                if (ampmEl) {
                    ampmEl.innerText = '';
                    ampmEl.classList.add('hidden');
                }

                const hStr = String(hours).padStart(2, '0');
                const mStr = String(minutes).padStart(2, '0');
                const sStr = String(seconds).padStart(2, '0');

                timeStr = showSec ? `${hStr}:${mStr}:${sStr}` : `${hStr}:${mStr}`;
            }

            const clockTimeEl = document.getElementById('clock-time');
            if (clockTimeEl) {
                clockTimeEl.innerText = timeStr;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 단일 타이머 변수 및 로직 ---
        let totalSeconds = 600;
        let timerInterval = null;
        let isRunning = false;

        function setTimerMinutes(mins) {
            if (isRunning) return;
            totalSeconds = mins * 60;
            renderTimerDisplay();
        }

        function syncEditableTimer(text) {
            if (isRunning) return;
            text = text.trim();
            const parts = text.split(':');
            let h = 0, m = 0, s = 0;
            if (parts.length === 3) {
                h = parseInt(parts[0]) || 0;
                m = parseInt(parts[1]) || 0;
                s = parseInt(parts[2]) || 0;
            } else if (parts.length === 2) {
                m = parseInt(parts[0]) || 0;
                s = parseInt(parts[1]) || 0;
            } else if (parts.length === 1) {
                m = parseInt(parts[0]) || 0;
            }
            totalSeconds = (h * 3600) + (m * 60) + s;
            renderTimerDisplay();
        }

        function renderTimerDisplay() {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            const mStr = String(m).padStart(2, '0');
            const sStr = String(s).padStart(2, '0');

            const displayEl = document.getElementById('timer-display');
            if (h > 0) {
                const hStr = String(h).padStart(2, '0');
                displayEl.innerText = `${hStr}:${mStr}:${sStr}`;
            } else {
                displayEl.innerText = `${mStr}:${sStr}`;
            }
        }

        function toggleTimer() {
            const btn = document.getElementById('btn-timer-toggle');
            const displayEl = document.getElementById('timer-display');

            if (!isRunning) {
                syncEditableTimer(displayEl.innerText);
                if (totalSeconds <= 0) return;

                isRunning = true;
                displayEl.setAttribute('contenteditable', 'false');
                btn.innerText = "일시정지";
                btn.className = "w-28 py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center";

                timerInterval = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        renderTimerDisplay();
                    }
                    if (totalSeconds <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        displayEl.setAttribute('contenteditable', 'true');
                        btn.innerText = "시작";
                        btn.className = "w-28 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center";
                        playAlarmSound();
                    }
                }, 1000);
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                displayEl.setAttribute('contenteditable', 'true');
                btn.innerText = "이어하기";
                btn.className = "w-28 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center";
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            const displayEl = document.getElementById('timer-display');
            displayEl.setAttribute('contenteditable', 'true');
            totalSeconds = 600;
            renderTimerDisplay();
            const btn = document.getElementById('btn-timer-toggle');
            btn.innerText = "시작";
            btn.className = "w-28 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center";
        }


        // --- 연속 타이머 (Sequential Timer) 로직 ---
        let seqTimersList = []; // 초 단위 배열
        let seqCurrentIndex = 0;
        let seqSecondsLeft = 0;
        let seqInterval = null;
        let seqIsRunning = false;
        let seqMode = 'auto'; // 'auto' 또는 'manual'

        function setSeqMode(mode) {
            seqMode = mode;
            const btnAuto = document.getElementById('btn-seq-auto');
            const btnManual = document.getElementById('btn-seq-manual');
            const modeBadge = document.getElementById('seq-mode-badge');

            if (mode === 'auto') {
                btnAuto.className = "py-1.5 rounded-lg font-bold text-xs bg-blue-600 text-white shadow transition";
                btnManual.className = "py-1.5 rounded-lg font-bold text-xs text-slate-600 dark:text-slate-400 transition";
                modeBadge.innerText = "자동 진행";
            } else {
                btnManual.className = "py-1.5 rounded-lg font-bold text-xs bg-blue-600 text-white shadow transition";
                btnAuto.className = "py-1.5 rounded-lg font-bold text-xs text-slate-600 dark:text-slate-400 transition";
                modeBadge.innerText = "수동 대기";
            }
        }

        function parseSeqTimes() {
            const rawText = document.getElementById('seq-times-input').value;
            const rawParts = rawText.split(/[\s,]+/);
            let list = [];
            for (let i = 0; i < rawParts.length; i++) {
                let p = rawParts[i].trim();
                if (!p) continue;
                if (p.includes(':')) {
                    const timeParts = p.split(':').map(Number);
                    let secs = 0;
                    if (timeParts.length === 3) {
                        secs = (timeParts[0] * 3600) + (timeParts[1] * 60) + timeParts[2];
                    } else if (timeParts.length === 2) {
                        secs = (timeParts[0] * 60) + timeParts[1];
                    }
                    if (!isNaN(secs) && secs > 0) {
                        list.push(secs);
                    }
                } else {
                    let mins = parseInt(p);
                    if (!isNaN(mins) && mins > 0) {
                        list.push(mins * 60);
                    }
                }
            }
            if (list.length === 0) list = [180, 300, 600]; // 디폴트
            return list;
        }

        function initSeqTimer() {
            if (seqIsRunning) return;
            seqTimersList = parseSeqTimes();
            seqCurrentIndex = 0;
            seqSecondsLeft = seqTimersList[0] || 60;
            renderSeqDisplay();
        }

        function updateSeqConfig() {
            if (!seqIsRunning) {
                initSeqTimer();
            }
        }

        function renderSeqDisplay() {
            const h = Math.floor(seqSecondsLeft / 3600);
            const m = Math.floor((seqSecondsLeft % 3600) / 60);
            const s = seqSecondsLeft % 60;

            const mStr = String(m).padStart(2, '0');
            const sStr = String(s).padStart(2, '0');

            const displayEl = document.getElementById('seq-timer-display');
            if (h > 0) {
                const hStr = String(h).padStart(2, '0');
                displayEl.innerText = `${hStr}:${mStr}:${sStr}`;
            } else {
                displayEl.innerText = `${mStr}:${sStr}`;
            }

            document.getElementById('seq-step-badge').innerText = `타이머 ${seqCurrentIndex + 1} / ${seqTimersList.length}`;
        }

        function toggleSeqTimer() {
            const btn = document.getElementById('btn-seq-toggle');

            if (!seqIsRunning) {
                if (seqTimersList.length === 0) initSeqTimer();
                if (seqSecondsLeft <= 0) return;

                seqIsRunning = true;
                btn.innerText = "일시정지";
                btn.className = "w-28 py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center";

                seqInterval = setInterval(() => {
                    if (seqSecondsLeft > 0) {
                        seqSecondsLeft--;
                        renderSeqDisplay();
                    }
                    if (seqSecondsLeft <= 0) {
                        playAlarmSound();
                        clearInterval(seqInterval);
                        seqIsRunning = false;

                        if (seqCurrentIndex < seqTimersList.length - 1) {
                            seqCurrentIndex++;
                            seqSecondsLeft = seqTimersList[seqCurrentIndex];
                            renderSeqDisplay();

                            if (seqMode === 'auto') {
                                setTimeout(() => {
                                    if (!seqIsRunning) toggleSeqTimer();
                                }, 1000);
                            } else {
                                btn.innerText = "다음 시작";
                                btn.className = "w-28 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center";
                            }
                        } else {
                            btn.innerText = "완료됨";
                            btn.className = "w-28 py-3 bg-slate-600 text-white font-bold rounded-2xl shadow-md text-base text-center cursor-not-allowed";
                        }
                    }
                }, 1000);
            } else {
                clearInterval(seqInterval);
                seqIsRunning = false;
                btn.innerText = "이어하기";
                btn.className = "w-28 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center";
            }
        }

        function resetSeqTimer() {
            clearInterval(seqInterval);
            seqIsRunning = false;
            initSeqTimer();
            const btn = document.getElementById('btn-seq-toggle');
            btn.innerText = "시작";
            btn.className = "w-28 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-md transition transform active:scale-95 text-base text-center";
        }


        // --- 오디오 알람 신시사이저 ---
        function playAlarmSound() {
            const isEnabled = document.getElementById('alarm-enabled').checked;
            if (!isEnabled) return;

            const soundType = document.getElementById('alarm-sound-select').value;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            if (soundType === 'beep2') {
                playTone(audioCtx, 523.25, 0, 0.25, 1.2);
                playTone(audioCtx, 659.25, 0.25, 0.25, 1.2);
                playTone(audioCtx, 783.99, 0.5, 0.35, 1.2);
                playTone(audioCtx, 1046.50, 0.85, 0.5, 1.2);
            } else if (soundType === 'chime') {
                playTone(audioCtx, 523.25, 0, 0.3, 1.2);  
                playTone(audioCtx, 659.25, 0.2, 0.3, 1.2); 
                playTone(audioCtx, 783.99, 0.4, 0.5, 1.2); 
            } else if (soundType === 'beep') {
                playTone(audioCtx, 587.33, 0, 0.2, 1.2);
                playTone(audioCtx, 587.33, 0.3, 0.2, 1.2);
                playTone(audioCtx, 587.33, 0.6, 0.4, 1.2);
            } else if (soundType === 'bell') {
                playTone(audioCtx, 659.25, 0, 0.4, 1.2); 
                playTone(audioCtx, 880, 0.3, 0.6, 1.2);    
            }
        }

        function playTone(audioCtx, freq, delay, duration, volume) {
            setTimeout(() => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch (e) {
                    console.error(e);
                }
            }, delay * 1000);
        }

        // 숫자 폰트 크기 조절 (최대 22rem 지원)
        function changeNumberFontSize(sizeVal) {
            const sizeStr = sizeVal + 'rem';
            document.getElementById('clock-time').style.fontSize = sizeStr;
            document.getElementById('timer-display').style.fontSize = sizeStr;
            document.getElementById('seq-timer-display').style.fontSize = sizeStr;
            document.getElementById('num-fontsize-label').innerText = sizeStr;
        }

        // 메모장 글자 크기 조절
        function changeMemoFontSize(size) {
            document.getElementById('memo-editor').style.fontSize = size + 'pt';
            document.getElementById('memo-fontsize-label').innerText = size + 'pt';
        }

        // 메모장 드래그 텍스트 부분 색상 변경
        function setForeColor(color) {
            document.execCommand('foreColor', false, color);
            document.getElementById('memo-editor').focus();
        }

        // 초기 로딩 시 설정
        window.addEventListener('DOMContentLoaded', () => {
            const memoEditor = document.getElementById('memo-editor');
            if (!document.documentElement.classList.contains('dark')) {
                memoEditor.style.color = '#1e293b';
            } else {
                memoEditor.style.color = '#ffffff';
            }
            setTitleAlign('center');
            initSeqTimer();
        });
    </script>
